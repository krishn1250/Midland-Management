spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://135.237.189.153:5433/school_db
    username: root
    password: midland
    driver-class-name: org.postgresql.Driver


    hikari:
      maximum-pool-size: 10             # Number of concurrent DB connections
      minimum-idle: 5                   # Keep 5 idle connections ready
      idle-timeout: 30000               # 30s — idle connections closed
      max-lifetime: 600000              # 10 min — refresh connections before Postgres kills them
      connection-timeout: 30000         # 30s — wait time to get a connection from pool
      leak-detection-threshold: 20000   # Log if a connection isn't closed within 20s
      keepalive-time: 300000            # Ping idle connections every 5 min
      validation-timeout: 5000          # Timeout for testing a connection
      connection-test-query: SELECT 1s


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
